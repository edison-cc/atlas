<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title description">
  <title id="title">Historical Atlas and Docker MCP benchmark observations — March 2026</title>
  <desc id="description">Two zero-based bar charts showing historical reported totals for five operations. Output: Docker MCP 6,421 characters, Atlas CLI 2,597, a 59.6 percent reduction. Sum of per-operation median execution times: Docker MCP 26,653 milliseconds, Atlas CLI 2,082, a 12.8 times ratio. These are unverified historical reports from an ephemeral Docker setup, not current-release or end-to-end agent measurements. Raw samples are unavailable.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .card-title { font-size: 21px; font-weight: 650; fill: #172033; }
    .metric { font-size: 44px; font-weight: 750; fill: #1d4ed8; letter-spacing: -1px; }
    .caption { font-size: 16px; fill: #475569; }
    .label { font-size: 16px; font-weight: 600; fill: #475569; }
    .value { font-size: 16px; font-weight: 650; fill: #334155; font-variant-numeric: tabular-nums; }
    .atlas { fill: #1d4ed8; }
    .note { font-size: 14px; fill: #64748b; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="549" rx="20" fill="#f4f7fc" stroke="#d8e1ec"/>
  <text x="32" y="47" font-size="27" font-weight="700" fill="#172033">Atlas vs Docker MCP</text>
  <rect x="684" y="23" width="244" height="32" rx="16" fill="#fff4dc" stroke="#e8c989"/>
  <text x="806" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">HISTORICAL · MARCH 2026</text>
  <text x="32" y="84" font-size="16" fill="#475569">Recorded observations for one five-operation workload. Lower bars indicate smaller totals.</text>
  <g>
    <rect x="24" y="124" width="444" height="312" rx="16" fill="#ffffff" stroke="#d8e1ec"/>
    <text x="48" y="161" class="card-title">Output size</text>
    <text x="48" y="212" class="metric">59.6%</text>
    <text x="48" y="238" class="caption">less output in the recorded sample</text>
    <text x="48" y="276" class="label">Docker MCP</text>
    <text x="444" y="276" text-anchor="end" class="value">6,421 chars</text>
    <rect x="48" y="288" width="396" height="24" rx="5" fill="#e7edf4"/>
    <rect x="48" y="288" width="396" height="24" rx="5" fill="#64748b"/>
    <text x="48" y="343" class="label atlas">Atlas CLI</text>
    <text x="444" y="343" text-anchor="end" class="value atlas">2,597 chars</text>
    <rect x="48" y="355" width="396" height="24" rx="5" fill="#e7edf4"/>
    <rect x="48" y="355" width="160.164" height="24" rx="5" fill="#2563eb"/>
    <text x="48" y="412" class="note">Five operations · reported character counts</text>
  </g>
  <g>
    <rect x="492" y="124" width="444" height="312" rx="16" fill="#ffffff" stroke="#d8e1ec"/>
    <text x="516" y="161" class="card-title">Execution time</text>
    <text x="516" y="212" class="metric">12.8×</text>
    <text x="516" y="238" class="caption">reported execution-time ratio</text>
    <text x="516" y="276" class="label">Docker MCP</text>
    <text x="912" y="276" text-anchor="end" class="value">26,653 ms</text>
    <rect x="516" y="288" width="396" height="24" rx="5" fill="#e7edf4"/>
    <rect x="516" y="288" width="396" height="24" rx="5" fill="#64748b"/>
    <text x="516" y="343" class="label atlas">Atlas CLI</text>
    <text x="912" y="343" text-anchor="end" class="value atlas">2,082 ms</text>
    <rect x="516" y="355" width="396" height="24" rx="5" fill="#e7edf4"/>
    <rect x="516" y="355" width="30.934" height="24" rx="5" fill="#2563eb"/>
    <text x="516" y="412" class="note">Five operations · sum of per-operation medians</text>
  </g>
  <circle cx="38" cy="469" r="5" fill="#b7791f"/>
  <text x="52" y="474" font-size="15" font-weight="650" fill="#854d0e">Unverified historical results · Original raw samples unavailable</text>
  <text x="32" y="503" font-size="14" fill="#475569">Timing boundary: local CLI subprocess vs warm Docker gateway with ephemeral containers.</text>
  <text x="32" y="527" font-size="14" fill="#475569">Excludes agent overhead. Character counts are not token counts. Not current-release performance claims.</text>
</svg>
