<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img">
  <title>Docker MCP compared with Atlas on schema size, output size, and latency</title>
  <desc>Three bar charts. Schema overhead: Docker MCP 108,867 characters, Atlas 901 characters. Output size: Docker MCP 6,421 characters, Atlas 2,597 characters. Median latency: Docker MCP about 5,300 milliseconds, Atlas about 400 milliseconds.</desc>
  <rect width="960" height="320" fill="#f6f8fa"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Schema -->
    <rect x="12" y="8" width="304" height="304" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="164" y="32" text-anchor="middle" font-size="14" font-weight="650" fill="#1f2328">Schema overhead</text>
    <text x="164" y="50" text-anchor="middle" font-size="12" fill="#656d76">73 tools, characters</text>
    <line x1="66" y1="72" x2="302" y2="72" stroke="#eaeef2"/>
    <line x1="66" y1="160" x2="302" y2="160" stroke="#eaeef2"/>
    <line x1="66" y1="248" x2="302" y2="248" stroke="#d0d7de"/>
    <text x="60" y="76" text-anchor="end" font-size="11" fill="#656d76">120k</text>
    <text x="60" y="164" text-anchor="end" font-size="11" fill="#656d76">60k</text>
    <text x="60" y="252" text-anchor="end" font-size="11" fill="#656d76">0</text>
    <rect x="122" y="88.3" width="44" height="159.7" fill="#6e7781"/>
    <rect x="202" y="246.7" width="44" height="1.3" fill="#0969da"/>
    <text x="144" y="82" text-anchor="middle" font-size="12" font-weight="650" fill="#1f2328">108,867</text>
    <text x="224" y="240" text-anchor="middle" font-size="12" font-weight="650" fill="#0969da">901</text>
    <text x="144" y="272" text-anchor="middle" font-size="12" fill="#1f2328">Docker MCP</text>
    <text x="224" y="272" text-anchor="middle" font-size="12" fill="#1f2328">Atlas</text>

    <!-- Output -->
    <rect x="328" y="8" width="304" height="304" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="480" y="32" text-anchor="middle" font-size="14" font-weight="650" fill="#1f2328">Output size</text>
    <text x="480" y="50" text-anchor="middle" font-size="12" fill="#656d76">5 operations, characters</text>
    <line x1="382" y1="72" x2="618" y2="72" stroke="#eaeef2"/>
    <line x1="382" y1="160" x2="618" y2="160" stroke="#eaeef2"/>
    <line x1="382" y1="248" x2="618" y2="248" stroke="#d0d7de"/>
    <text x="376" y="76" text-anchor="end" font-size="11" fill="#656d76">7,000</text>
    <text x="376" y="164" text-anchor="end" font-size="11" fill="#656d76">3,500</text>
    <text x="376" y="252" text-anchor="end" font-size="11" fill="#656d76">0</text>
    <rect x="438" y="86.6" width="44" height="161.4" fill="#6e7781"/>
    <rect x="518" y="182.7" width="44" height="65.3" fill="#0969da"/>
    <text x="460" y="80" text-anchor="middle" font-size="12" font-weight="650" fill="#1f2328">6,421</text>
    <text x="540" y="176" text-anchor="middle" font-size="12" font-weight="650" fill="#0969da">2,597</text>
    <text x="460" y="272" text-anchor="middle" font-size="12" fill="#1f2328">Docker MCP</text>
    <text x="540" y="272" text-anchor="middle" font-size="12" fill="#1f2328">Atlas</text>

    <!-- Latency -->
    <rect x="644" y="8" width="304" height="304" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="796" y="32" text-anchor="middle" font-size="14" font-weight="650" fill="#1f2328">Median latency</text>
    <text x="796" y="50" text-anchor="middle" font-size="12" fill="#656d76">milliseconds</text>
    <line x1="698" y1="72" x2="934" y2="72" stroke="#eaeef2"/>
    <line x1="698" y1="160" x2="934" y2="160" stroke="#eaeef2"/>
    <line x1="698" y1="248" x2="934" y2="248" stroke="#d0d7de"/>
    <text x="692" y="76" text-anchor="end" font-size="11" fill="#656d76">6,000</text>
    <text x="692" y="164" text-anchor="end" font-size="11" fill="#656d76">3,000</text>
    <text x="692" y="252" text-anchor="end" font-size="11" fill="#656d76">0</text>
    <rect x="754" y="92.5" width="44" height="155.5" fill="#6e7781"/>
    <rect x="834" y="236.3" width="44" height="11.7" fill="#0969da"/>
    <text x="776" y="86" text-anchor="middle" font-size="12" font-weight="650" fill="#1f2328">~5,300</text>
    <text x="856" y="230" text-anchor="middle" font-size="12" font-weight="650" fill="#0969da">~400</text>
    <text x="776" y="272" text-anchor="middle" font-size="12" fill="#1f2328">Docker MCP</text>
    <text x="856" y="272" text-anchor="middle" font-size="12" fill="#1f2328">Atlas</text>
  </g>
</svg>
