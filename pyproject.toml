[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-cli"
version = "0.3.0"
description = "Compact CLI for Jira and Confluence Cloud REST APIs"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/edison-cc/atlas"
Issues = "https://github.com/edison-cc/atlas/issues"

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]
