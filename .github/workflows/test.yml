name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python tests/test_conf_publish.py
      - run: python tests/test_config.py
      - run: python tests/test_request_errors.py
      - run: python tests/test_jira_get.py
      - run: python tests/test_read_fidelity.py
      - run: python tests/test_write_output.py
      - run: python tests/test_benchmarks.py
      - run: atlas --version
      - run: atlas jira --help
      - run: atlas conf --help
